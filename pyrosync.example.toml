# Copy to pyrosync.toml (git-ignored) or point PYROSYNC_CONFIG at any file.
# Every key is optional; omitted keys keep the defaults shown here.
# Environment variables (PYROSYNC_*, see .env.example) override this file.

[dedup]
# Interscan duplicates: maximum time difference between two detections of one sensor, in seconds.
max_time_diff_secs = 8
# Interscan duplicates: minimum pixel footprint overlap, as a ratio in 0.0..=1.0.
min_overlap_ratio = 0.30

[fleet]
# VIIRS platforms (SNPP, NOAA-20, NOAA-21) merge when detected within this many seconds.
viirs_window_secs = 3600
# MODIS platforms (Terra, Aqua) merge when detected within this many seconds.
modis_window_secs = 10800
# Maximum distance in km between detections merged into one fleet observation.
radius_km = 2.0

[matching]
# Maximum MODIS-to-VIIRS distance in km for a cross-sensor match (at most 10).
radius_km = 2.0
# Maximum MODIS-to-VIIRS time difference in seconds (180 minutes: same-fire MODIS/VIIRS
# overpasses are at least 34 minutes apart in FIRMS data, so a narrow window finds no matches).
window_secs = 10800

[vza]
# MODIS viewing-zenith correction ratio R_rel(theta) = a*theta^2 + b*theta + c (theta in radians),
# normalized at nadir from Zheng et al. (2026) Eq. 9 & Fig. 4 (0.24*theta^2 + 0.02*theta + 1.19)
# by dividing by 1.19 so nadir equals 1.0 (base level is measured separately in k_c).
a = 0.2017
b = 0.0168
c = 1.0

[calibration]
# Pre-VIIRS (2000-2011) cell completeness factor k_c = sum(VIIRS) / sum(MODIS * R_rel(theta)),
# applied ONLY to CalendarCell.total_frp in monthly cells with no VIIRS-platform detections.
# Measured from collocated Aqua MODIS vs SNPP 375 m daytime data (<= 20 min, 1x1 deg cell-day;
# 2019 fit, 2020 hold-out), mirrored by |lat| across hemispheres with linear interpolation in
# 50-55 deg and clamping above 70 deg. Consistent with Li et al. (2020) and Sofiev & Kouznetsov (2026).
enabled = true

[[calibration.bands]]
min_abs_lat = 0.0
max_abs_lat = 30.0
ratio = 1.11
ratio_sigma = 0.08

[[calibration.bands]]
min_abs_lat = 30.0
max_abs_lat = 50.0
ratio = 1.18
ratio_sigma = 0.15

[[calibration.bands]]
min_abs_lat = 55.0
max_abs_lat = 70.0
ratio = 1.28
ratio_sigma = 0.11

[uncertainty]
# Analytical FRP confidence bounds combining sensor noise, VZA correction error, and
# MODIS scale/completeness uncertainty. Parameters below are model assumptions, not published values.
modis_sensor_sigma = 0.12
viirs_sensor_sigma = 0.08
vza_error_coeff = 0.05
modis_scale_sigma = 0.10
# Gaussian z-multiplier (z = 1.0 gives ~68.27% two-sided confidence).
z = 1.0

[static_mask]
# Drops type-0 detections in H3 resolution-7 cells (~5 km2) that hold a detection in at least
# min_active_months distinct months of the same calendar year (gas flares, industry). Each year
# is judged on its own, so windows shorter than min_active_months months are never masked.
# 10 is the smallest value at which >= 80% of dropped rows lie in cells FIRMS itself flags as
# static (type 1/2) in every country sampled (static_mask_check example, 2013-2024).
enabled = true
min_active_months = 10

[sama]
# Drops nighttime VIIRS detections inside the South Atlantic Magnetic Anomaly box (VFIRE375
# SPA User's Guide v1.9: 110W-11E, 55S-7N). Off by default: Collection 2 already removes the
# SAMA low-confidence pixels and the archive shows no excess isolated night detections there,
# so the box would mostly remove real South American night fires (22-36% of VIIRS rows).
enabled = false
west = -110.0
east = 11.0
south = -55.0
north = 7.0
