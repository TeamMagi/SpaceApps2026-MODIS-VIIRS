# Small-fire power-law budget: shipped EMPTY, so the default chain is measured table -> latitude
# band. The model brackets the measured savanna completeness without predicting it: the
# literature alpha = 1.31 gives k ~ 1.03-1.04 (too low) while alpha ~ 2.2 and p_max ~ 190 MW from
# our own VIIRS data give ~1.6 day / ~2.5 night (too high) against the measured 1.19 / 1.32.
# For experiments add entries, e.g.:
#   [[calibration.power_law]]
#   biome = "savanna"
#   alpha = 1.31
#   alpha_sigma = 0.1   # default; an assumption, not a measurement
#   p_max_mw = 1000.0
# k = sum(VIIRS seen) / sum(MODIS seen), each sensor weighted by the Sofiev & Kouznetsov (2026)
# Eq. 5-7 detection probability; MODIS pixel area averaged over the +-55 deg swath (1 - ~9.7
# km2), VIIRS at nadir 0.375 x 0.375 km. alpha_sigma is propagated as half the spread of k at
# alpha +- alpha_sigma. A power-law entry only answers for biomes without a measured row.

[[calibration.bands]]
min_abs_lat = 0.0
max_abs_lat = 30.0
ratio = 1.11
ratio_sigma = 0.08

[[calibration.bands]]
min_abs_lat = 30.0
max_abs_lat = 50.0
ratio = 1.18
ratio_sigma = 0.15

[[calibration.bands]]
min_abs_lat = 55.0
max_abs_lat = 70.0
ratio = 1.28
ratio_sigma = 0.11

[uncertainty]
# Analytical FRP confidence bounds combining sensor noise, VZA correction error, and
# MODIS scale/completeness uncertainty. Except modis_sensor_sigma (Freeborn et al. 2014a),
# defaults are model assumptions: vza_error_coeff = 1.0 assumes 1-sigma VZA error equals the
# applied correction magnitude (factor - 1) because Aqua's R_rel(theta) proxies Terra.
modis_sensor_sigma = 0.266
viirs_sensor_sigma = 0.08
vza_error_coeff = 1.0
modis_scale_sigma = 0.10
# Gaussian z-multiplier (z = 1.0 gives ~68.27% two-sided confidence).
z = 1.0
# 30°G–30°K tropikal MODIS swath boşluğu telafisi (varsayılan kapalı).
tropical_swath_gap_compensation = false

[static_mask]
# Drops type-0 detections in H3 resolution-7 cells (~5 km2) that hold a detection in at least
# min_active_months distinct months of the same calendar year (gas flares, industry). Each year
# is judged on its own, so windows shorter than min_active_months months are never masked.
# 10 is the smallest value at which >= 80% of dropped rows lie in cells FIRMS itself flags as
# static (type 1/2) in every country sampled (static_mask_check example, 2013-2024).
enabled = true
min_active_months = 10

[sama]
# Drops nighttime VIIRS detections inside the South Atlantic Magnetic Anomaly box (VFIRE375
# SPA User's Guide v1.9: 110W-11E, 55S-7N). Off by default: Collection 2 already removes the
# SAMA low-confidence pixels and the archive shows no excess isolated night detections there,
# so the box would mostly remove real South American night fires (22-36% of VIIRS rows).
enabled = false
west = -110.0
east = 11.0
south = -55.0
north = 7.0
