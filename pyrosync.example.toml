# Copy to pyrosync.toml (git-ignored) or point PYROSYNC_CONFIG at any file.
# Every key is optional; omitted keys keep the defaults shown here.
# Environment variables (PYROSYNC_*, see .env.example) override this file.

[dedup]
# Interscan duplicates: maximum time difference between two detections of one sensor, in seconds.
max_time_diff_secs = 8
# Interscan duplicates: minimum pixel footprint overlap, as a ratio in 0.0..=1.0.
min_overlap_ratio = 0.30

[fleet]
# VIIRS platforms (SNPP, NOAA-20, NOAA-21) merge when detected within this many seconds.
viirs_window_secs = 3600
# MODIS platforms (Terra, Aqua) merge when detected within this many seconds.
modis_window_secs = 10800
# Maximum distance in km between detections merged into one fleet observation.
radius_km = 2.0

[matching]
# Maximum MODIS-to-VIIRS distance in km for a cross-sensor match (at most 10).
radius_km = 2.0
# Maximum MODIS-to-VIIRS time difference in seconds (180 minutes for same-fire matching).
# In 4 live NRT regions (G2), co-located pairs were at least 34 min apart (median ~158 min).
# The 2000-2025 FIRMS country archive has plentiful Aqua/S-NPP pairs within 20 min
# (both cross the equator around 13:30); Terra (~10:30) does not coincide with VIIRS,
# and S-NPP/NOAA-20 are ~50 min apart, so the wider matching window is still needed.
window_secs = 10800
# Matched records with a MODIS-to-VIIRS time difference within this many seconds form the
# simultaneous_matched subset, reserved for radiometric comparisons (k_c itself was measured
# separately from near-simultaneous Aqua/S-NPP cell-day pairs).
# Archive pairs allow a diagnostic check, not performed in code; the Zheng et al. (2026)
# VZA curve and provisional VIIRS sigma 0.08 are not re-fitted.
simultaneous_window_secs = 1200

[vza]
# MODIS viewing-zenith correction ratio R_rel(theta) = a*theta^2 + b*theta + c (theta in radians),
# normalized at nadir from Zheng et al. (2026) Eq. 9 & Fig. 4 (0.24*theta^2 + 0.02*theta + 1.19)
# by dividing by 1.19 so nadir equals 1.0 (base level is measured separately in k_c).
a = 0.2017
b = 0.0168
c = 1.0

[calibration]
# Pre-VIIRS (2000-2011) cell completeness factor k_c = sum(VIIRS) / sum(MODIS * R_rel(theta)),
# applied ONLY to CalendarCell.total_frp in monthly cells with no VIIRS-platform detections.
# Measured from collocated Aqua MODIS vs SNPP 375 m daytime data (<= 20 min, 1x1 deg cell-day;
# 2019 fit, 2020 hold-out), mirrored by |lat| across hemispheres with linear interpolation in
# 50-55 deg and clamping above 70 deg. Consistent with Li et al. (2020) and Sofiev & Kouznetsov (2026).
enabled = true
# "biome": month x biome x day/night table, then (only if configured) the power-law small-fire
# budget, then the latitude bands below (the fallback for non-burnable/unknown biomes and
# biomes without measured rows).
# "lat_band": bands only (the pre-K14 behaviour).
mode = "biome"
# Measured completeness per (biome, month, daynight); month/daynight may be omitted to pool.
# This is the measured table of crates/firms-client/examples/biome_completeness.rs (K14: fit year
# 2019, 12 regions; report in docs/BIYOM_TAMLIK.md), pasted from its `--emit-toml` output.
# `ratio_sigma` is the standard error of the ratio of sums, not the cell-day spread of the
# latitude bands below, so it is much smaller than their sigma and understates cell-level
# uncertainty. A ratio below 1 is a legitimate measurement. Tundra and wetland have no rows
# and use the latitude bands.
[[calibration.biome_table]]
biome = "forest"
ratio = 1.091
ratio_sigma = 0.016
n = 8626

