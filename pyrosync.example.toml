# Copy to pyrosync.toml (git-ignored) or point PYROSYNC_CONFIG at any file.
# Every key is optional; omitted keys keep the defaults shown here.
# Environment variables (PYROSYNC_*, see .env.example) override this file.

[dedup]
# Interscan duplicates: maximum time difference between two detections of one sensor, in seconds.
max_time_diff_secs = 8
# Interscan duplicates: minimum pixel footprint overlap, as a ratio in 0.0..=1.0.
min_overlap_ratio = 0.30

[fleet]
# VIIRS platforms (SNPP, NOAA-20, NOAA-21) merge when detected within this many seconds.
viirs_window_secs = 3600
# MODIS platforms (Terra, Aqua) merge when detected within this many seconds.
modis_window_secs = 10800
# Maximum distance in km between detections merged into one fleet observation.
radius_km = 2.0

[matching]
# Maximum MODIS-to-VIIRS distance in km for a cross-sensor match (at most 10).
radius_km = 2.0
# Maximum MODIS-to-VIIRS time difference in seconds (180 minutes: same-fire MODIS/VIIRS
# overpasses are at least 34 minutes apart in FIRMS data, so a narrow window finds no matches).
window_secs = 10800

[vza]
# MODIS viewing-zenith correction ratio R = a*theta^2 + b*theta + c (theta in radians).
# These coefficients are uncalibrated placeholders, not fitted values.
a = 0.85
b = 0.12
c = 1.0

[calibration]
# Latitude-band MODIS->VIIRS FRP scaling applied only to ModisOnly records (Matched and
# ViirsOnly already use VIIRS FRP). Ratios are VIIRS/MODIS from Li et al. (2018),
# "Comparison of Fire Radiative Power Estimates From VIIRS and MODIS Observations"
# (JGR: Atmospheres, doi:10.1029/2017JD027823), mirrored by |lat| across hemispheres.
# Transition gaps between bands (50-55 deg) are linearly interpolated; |lat| > 70 clamps to
# the last band. ratio_sigma values are derived spread estimates, not fitted sigmas.
enabled = true

[[calibration.bands]]
min_abs_lat = 0.0
max_abs_lat = 30.0
ratio = 1.16
ratio_sigma = 0.13

[[calibration.bands]]
min_abs_lat = 30.0
max_abs_lat = 50.0
ratio = 0.97
ratio_sigma = 0.03

[[calibration.bands]]
min_abs_lat = 55.0
max_abs_lat = 70.0
ratio = 0.82
ratio_sigma = 0.18

[uncertainty]
# Analytical FRP confidence bounds combining sensor noise, VZA correction error, and
# MODIS->VIIRS calibration uncertainty. Default sensor-noise and VZA error parameters
# below are initial assumptions, not published values.
modis_sensor_sigma = 0.12
viirs_sensor_sigma = 0.08
vza_error_coeff = 0.05
# Gaussian z-multiplier (z = 1.0 gives ~68.27% two-sided confidence).
z = 1.0
