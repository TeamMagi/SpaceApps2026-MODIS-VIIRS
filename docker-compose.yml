services:
  pyrosync:
    build: .
    container_name: pyrosync
    # Match the image's non-root pyrosync user (999:999) by default so Docker Desktop works out of the box;
    # Linux users can override DOCKER_USER=$(id -u):$(id -g) in .env to write to the bind-mounted cache.
    user: "${DOCKER_USER:-999:999}"
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      - FIRMS_API_KEY=${FIRMS_API_KEY}
      - PORT=${PORT:-3001}
      - STATIC_DIR=${STATIC_DIR:-/app/static}
      - RUST_LOG=${RUST_LOG:-pyrosync=info}
      - ARCHIVE_CACHE_DIR=${ARCHIVE_CACHE_DIR:-/app/.cache/firms-archive}
      - CACHE_BUDGET_MB=${CACHE_BUDGET_MB:-128}
      - REQUEST_TIMEOUT_SECS=${REQUEST_TIMEOUT_SECS:-300}
      # Pass through only when defined so an unset value keeps CORS permissive rather than passing ""
      - CORS_ALLOWED_ORIGINS
    volumes:
      # Read-only because the server only reads offline fixtures and never writes to ./data
      - ./data:/app/data:ro
      # Read-only because pyrosync uses an offline ArchiveClient and never writes or downloads archive files
      - ${ARCHIVE_CACHE_HOST_DIR:-./.cache/firms-archive}:/app/.cache/firms-archive:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT:-3001}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - pyrosync

  seed:
    profiles: ["seed"]
    build: .
    # Match host user on Linux via DOCKER_USER so seeded files remain writable by both host and pyrosync
    user: "${DOCKER_USER:-999:999}"
    entrypoint: ["./archive-seed"]
    environment:
      - ARCHIVE_CACHE_DIR=${ARCHIVE_CACHE_DIR:-/app/.cache/firms-archive}
      - ARCHIVE_SET_FILE=${ARCHIVE_SET_FILE:-/app/data/archive-set.json}
      - RUST_LOG=${RUST_LOG:-pyrosync=info}
    volumes:
      # Writable bind-mount of the same host directory read by pyrosync so a single ~41 GB copy serves host and container
      - ${ARCHIVE_CACHE_HOST_DIR:-./.cache/firms-archive}:/app/.cache/firms-archive
    # Country archive downloads use static unauthenticated CSVs and never need FIRMS_API_KEY;
    # keep the API key out of the seed container to avoid unnecessary secret exposure.
    restart: "no"
    networks:
      - pyrosync

networks:
  pyrosync:
    # Outbound-enabled bridge: internal: true would block NASA FIRMS API requests
    driver: bridge
