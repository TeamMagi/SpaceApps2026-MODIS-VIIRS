services:
  pyrosync:
    build: .
    container_name: pyrosync
    ports:
      - "${PORT:-3001}:${PORT:-3001}"
    environment:
      - FIRMS_API_KEY=${FIRMS_API_KEY}
      - PORT=${PORT:-3001}
      - STATIC_DIR=${STATIC_DIR:-/app/static}
      - RUST_LOG=${RUST_LOG:-pyrosync=info}
      - ARCHIVE_CACHE_DIR=${ARCHIVE_CACHE_DIR:-/app/.cache/firms-archive}
      - CACHE_BUDGET_MB=${CACHE_BUDGET_MB:-128}
      - REQUEST_TIMEOUT_SECS=${REQUEST_TIMEOUT_SECS:-300}
      # Pass through only when defined so an unset value keeps CORS permissive rather than passing ""
      - CORS_ALLOWED_ORIGINS
    volumes:
      # Read-only because the server only reads offline fixtures and never writes to ./data
      - ./data:/app/data:ro
      # Persist ~2.4 GB of downloaded FIRMS country archives across container restarts
      - firms-archive:/app/.cache/firms-archive
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:$${PORT:-3001}/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - pyrosync

volumes:
  firms-archive:

networks:
  pyrosync:
    # Outbound-enabled bridge: internal: true would block NASA FIRMS API requests
    driver: bridge
