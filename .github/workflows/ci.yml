name: CI

on:
  push:
    branches: [main]
    # Documentation-only changes skip CI. data/** and web/** must keep triggering it (web imports data/case-study/turkey/stats.json).
    paths-ignore:
      - docs/**
      - '**/*.md'
      - GOREVLER.md
  pull_request:
    branches: [main]
    paths-ignore:
      - docs/**
      - '**/*.md'
      - GOREVLER.md
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Runs on main are never cancelled by a newer push, so every pushed commit on main keeps its own verdict; PR and other branches still cancel older runs.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Pinned: ubuntu-latest is moving to a newer Ubuntu image. Unpin after the first green run on 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned to the local dev image's Rust (1.100) so a new stable cannot break clippy -D warnings; bump together with the Dockerfile.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: clippy
      # The cache key already includes the job id, so rust and coverage keep separate caches.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test
        run: cargo test --workspace --locked

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Pinned to the local dev image's Rust (1.100); bump together with the Dockerfile.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100"
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Quality gate: 90% line coverage (measured total is 95.5%). The gate sits a few
      # points under the measured value so real decay turns CI red. Branch coverage is
      # not gated because `cargo llvm-cov --branch` requires a nightly toolchain.
      - name: Coverage gate
        run: cargo llvm-cov --workspace --locked --fail-under-lines 90 --lcov --output-path lcov.info
      - name: Coverage summary
        if: always()
        run: cargo llvm-cov report --summary-only
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        # Node 22: the web test script uses a quoted glob with node --test, which Node 20 does not expand.
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
